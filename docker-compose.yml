services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: thriftstore
      POSTGRES_USER: thriftstore
      POSTGRES_PASSWORD: example
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"

volumes:
  pgdata: